<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mada General Store</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }

    body {
        background: #f1f3f6;
        color: #212121;
    }

    /* HEADER */
    header {
        background: #2874f0;
        color: white;
        padding: 12px 5%;
        display: flex;
        align-items: center;
        gap: 25px;
        position: sticky;
        top: 0;
        z-index: 1000;
    }

    .logo {
        font-size: 25px;
        font-weight: bold;
        white-space: nowrap;
    }

    .logo span {
        color: #ffe500;
        font-style: italic;
    }

    .search-box {
        flex: 1;
        display: flex;
    }

    .search-box input {
        width: 100%;
        padding: 12px;
        border: none;
        outline: none;
        font-size: 15px;
        border-radius: 3px 0 0 3px;
    }

    .search-box button {
        border: none;
        background: white;
        color: #2874f0;
        padding: 0 18px;
        cursor: pointer;
        font-size: 18px;
    }

    .header-buttons {
        display: flex;
        gap: 10px;
    }

    .header-buttons button {
        background: white;
        color: #2874f0;
        border: none;
        padding: 10px 14px;
        font-weight: bold;
        cursor: pointer;
        border-radius: 3px;
    }

    /* CATEGORIES */
    .categories {
        background: white;
        padding: 15px 5%;
        display: flex;
        gap: 15px;
        overflow-x: auto;
        box-shadow: 0 2px 4px rgba(0,0,0,.1);
    }

    .category {
        border: 1px solid #ddd;
        padding: 8px 15px;
        border-radius: 20px;
        cursor: pointer;
        white-space: nowrap;
        background: white;
    }

    .category:hover,
    .category.active {
        background: #2874f0;
        color: white;
    }

    /* BANNER */
    .banner {
        margin: 15px 5%;
        background: linear-gradient(90deg,#2874f0,#0b57d0);
        color: white;
        padding: 30px;
        border-radius: 5px;
        text-align: center;
    }

    .banner h1 {
        font-size: 30px;
        margin-bottom: 8px;
    }

    /* PRODUCTS */
    .products-container {
        padding: 10px 5% 50px;
    }

    .section-title {
        margin: 15px 0;
        font-size: 24px;
    }

    .products {
        display: grid;
        grid-template-columns: repeat(auto-fill,minmax(190px,1fr));
        gap: 15px;
    }

    .product {
        background: white;
        padding: 15px;
        border-radius: 4px;
        box-shadow: 0 1px 4px rgba(0,0,0,.15);
        transition: .2s;
        position: relative;
    }

    .product:hover {
        transform: translateY(-3px);
        box-shadow: 0 3px 12px rgba(0,0,0,.2);
    }

    .product img {
        width: 100%;
        height: 160px;
        object-fit: contain;
        margin-bottom: 10px;
    }

    .product h3 {
        font-size: 16px;
        margin-bottom: 6px;
    }

    .category-label {
        color: #777;
        font-size: 12px;
        margin-bottom: 8px;
    }

    .price {
        font-size: 20px;
        font-weight: bold;
        color: #212121;
        margin-bottom: 10px;
    }

    .add-cart {
        width: 100%;
        padding: 10px;
        background: #ff9f00;
        border: none;
        color: white;
        font-weight: bold;
        cursor: pointer;
        border-radius: 3px;
    }

    .admin-controls {
        display: none;
        gap: 5px;
        margin-top: 8px;
    }

    body.admin-mode .admin-controls {
        display: flex;
    }

    .edit-btn,
    .delete-btn {
        flex: 1;
        border: none;
        padding: 8px;
        cursor: pointer;
        color: white;
        border-radius: 3px;
    }

    .edit-btn {
        background: #2874f0;
    }

    .delete-btn {
        background: #e53935;
    }

    /* MODALS */
    .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,.65);
        z-index: 2000;
        align-items: center;
        justify-content: center;
        padding: 15px;
    }

    .modal-content {
        background: white;
        width: 100%;
        max-width: 500px;
        max-height: 90vh;
        overflow-y: auto;
        border-radius: 5px;
        padding: 25px;
    }

    .modal-content h2 {
        margin-bottom: 20px;
    }

    .close {
        float: right;
        font-size: 25px;
        cursor: pointer;
    }

    .form-group {
        margin-bottom: 15px;
    }

    .form-group label {
        display: block;
        font-weight: bold;
        margin-bottom: 5px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
        width: 100%;
        padding: 11px;
        border: 1px solid #ccc;
        border-radius: 3px;
    }

    .save-btn {
        width: 100%;
        padding: 12px;
        background: #2874f0;
        color: white;
        border: none;
        cursor: pointer;
        font-weight: bold;
        border-radius: 3px;
    }

    /* CART */
    .cart-item {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 0;
        border-bottom: 1px solid #ddd;
    }

    .quantity-controls button {
        padding: 4px 8px;
        cursor: pointer;
    }

    .cart-total {
        font-size: 20px;
        font-weight: bold;
        margin-top: 20px;
    }

    .whatsapp-btn {
        width: 100%;
        margin-top: 15px;
        padding: 13px;
        border: none;
        background: #25D366;
        color: white;
        font-weight: bold;
        cursor: pointer;
        border-radius: 4px;
        font-size: 16px;
    }

    .empty {
        text-align: center;
        padding: 40px;
        color: #777;
    }

    .admin-bar {
        display: none;
        background: #ffe500;
        padding: 10px 5%;
        justify-content: space-between;
        align-items: center;
    }

    body.admin-mode .admin-bar {
        display: flex;
    }

    .admin-bar button {
        padding: 8px 12px;
        border: none;
        background: #2874f0;
        color: white;
        cursor: pointer;
    }

    footer {
        background: #172337;
        color: white;
        padding: 30px 5%;
        text-align: center;
    }

    @media(max-width:700px) {
        header {
            flex-wrap: wrap;
        }

        .search-box {
            order: 3;
            flex-basis: 100%;
        }

        .logo {
            font-size: 20px;
        }

        .products {
            grid-template-columns: repeat(2,1fr);
        }

        .product img {
            height: 120px;
        }
    }
</style>
</head>

<body>

<header>
    <div class="logo">Mada <span>General Store</span></div>

    <div class="search-box">
        <input
            type="text"
            id="searchInput"
            placeholder="Search for groceries..."
            oninput="displayProducts()"
        >
        <button>🔍</button>
    </div>

    <div class="header-buttons">
        <button onclick="openCart()">🛒 Cart (<span id="cartCount">0</span>)</button>
        <button onclick="openAdminLogin()">Admin</button>
    </div>
</header>

<div class="admin-bar">
    <strong>🔐 ADMIN MODE ACTIVE</strong>
    <div>
        <button onclick="openAddProduct()">➕ Add Product</button>
        <button onclick="logoutAdmin()">Logout</button>
    </div>
</div>

<div class="categories" id="categories"></div>

<section class="banner">
    <h1>Welcome to Mada General Store</h1>
    <p>Fresh groceries at today's prices 🛒</p>
</section>

<div class="products-container">
    <h2 class="section-title">Today's Grocery Items</h2>
    <div class="products" id="products"></div>
</div>

<footer>
    <h2>Mada General Store</h2>
    <p>Fresh groceries • Best prices • Easy ordering</p>
    <p style="margin-top:10px;">Orders via WhatsApp: 8792043577</p>
</footer>


<!-- ADMIN LOGIN -->
<div class="modal" id="adminLoginModal">
    <div class="modal-content">
        <span class="close" onclick="closeModal('adminLoginModal')">&times;</span>

        <h2>Admin Login</h2>

        <div class="form-group">
            <label>Admin PIN</label>
            <input type="password" id="adminPin" maxlength="6" placeholder="Enter PIN">
        </div>

        <button class="save-btn" onclick="loginAdmin()">Login</button>

        <p id="loginError" style="color:red;margin-top:10px;"></p>
    </div>
</div>


<!-- ADD / EDIT PRODUCT -->
<div class="modal" id="productModal">
    <div class="modal-content">
        <span class="close" onclick="closeModal('productModal')">&times;</span>

        <h2 id="productModalTitle">Add Product</h2>

        <input type="hidden" id="editProductId">

        <div class="form-group">
            <label>Product Name</label>
            <input id="productName" placeholder="Example: Rice 5kg">
        </div>

        <div class="form-group">
            <label>Today's Price (₹)</label>
            <input id="productPrice" type="number" min="0" placeholder="Example: 350">
        </div>

        <div class="form-group">
            <label>Category</label>
            <select id="productCategory">
                <option>Rice & Grains</option>
                <option>Dal & Pulses</option>
                <option>Oil</option>
                <option>Spices</option>
                <option>Fruits</option>
                <option>Vegetables</option>
                <option>Dairy</option>
                <option>Snacks</option>
                <option>Beverages</option>
                <option>Personal Care</option>
                <option>Household</option>
                <option>Other</option>
            </select>
        </div>

        <div class="form-group">
            <label>Product Image URL</label>
            <input id="productImage" placeholder="https://example.com/product.jpg">
        </div>

        <div class="form-group">
            <label>Product Description</label>
            <textarea id="productDescription" rows="3"></textarea>
        </div>

        <button class="save-btn" onclick="saveProduct()">Save Product</button>
    </div>
</div>


<!-- CART -->
<div class="modal" id="cartModal">
    <div class="modal-content">
        <span class="close" onclick="closeModal('cartModal')">&times;</span>

        <h2>🛒 Your Cart</h2>

        <div id="cartItems"></div>

        <div class="cart-total">
            Total: ₹<span id="cartTotal">0</span>
        </div>

        <div style="margin-top:20px;">
            <div class="form-group">
                <label>Customer Name</label>
                <input id="customerName" placeholder="Your name">
            </div>

            <div class="form-group">
                <label>Delivery Address</label>
                <textarea id="customerAddress" rows="3"
                    placeholder="Enter delivery address"></textarea>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input id="customerPhone" placeholder="Your phone number">
            </div>
        </div>

        <button class="whatsapp-btn" onclick="sendWhatsAppOrder()">
            📲 Order on WhatsApp
        </button>
    </div>
</div>


<script>

/* =========================================================

   Admin can edit/delete/add them.
========================================================= */

const defaultProducts = [

    {

    },
    {
        id: 7,

    },
    {

    {

        image: "https://images.unsplash.com/photo-1618512496248-a07fe83aa8cb?auto=format&fit=crop&w=500&q=80",

    },
    {

    },
    {

    },
    {

    },
    {

        name: "Biscuits",
        price: 30,
        category: "Snacks",
        image: "https://images.unsplash.com/photo-1558961363-fa8fdf82db35?auto=format&fit=crop&w=500&q=80",
        description: "Crispy biscuits"
    },
    {
        id: 15,
        name: "Detergent 1kg",
        price: 110,
        category: "Household",
        image: "https://images.unsplash.com/photo-1585832770485-e68a5dbfad52?auto=format&fit=crop&w=500&q=80",
        description: "Powerful detergent"
    }
];


/* =========================================================
   STORAGE
========================================================= */

let products = JSON.parse(localStorage.getItem("madaProducts"));

if (!products) {
    products = defaultProducts;
    saveProducts();
}

let cart = JSON.parse(localStorage.getItem("madaCart")) || [];

let selectedCategory = "All";

let isAdmin = sessionStorage.getItem("madaAdmin") === "true";

if (isAdmin) {
    document.body.classList.add("admin-mode");
}


/* =========================================================
   SAVE PRODUCTS
========================================================= */

function saveProducts() {
    localStorage.setItem("madaProducts", JSON.stringify(products));
}


/* =========================================================
   CATEGORIES
========================================================= */

function displayCategories() {

    const categories = ["All", ...new Set(products.map(p => p.category))];

    const container = document.getElementById("categories");

    container.innerHTML = categories.map(category => `
        <div
            class="category ${selectedCategory === category ? "active" : ""}"
            onclick="selectCategory('${escapeQuotes(category)}')">
            ${category}
        </div>
    `).join("");
}


function selectCategory(category) {
    selectedCategory = category;
    displayCategories();
    displayProducts();
}


/* =========================================================
   PRODUCTS
========================================================= */

function displayProducts() {

    const search = document
        .getElementById("searchInput")
        .value
        .toLowerCase();

    const container = document.getElementById("products");

    let filtered = products.filter(product => {

        const matchesSearch =
            product.name.toLowerCase().includes(search) ||
            product.category.toLowerCase().includes(search);

        const matchesCategory =
            selectedCategory === "All" ||
            product.category === selectedCategory;

        return matchesSearch && matchesCategory;
    });

    if (filtered.length === 0) {
        container.innerHTML = `
            <div class="empty">
                <h3>No products found</h3>
                <p>Try another search.</p>
            </div>
        `;
        return;
    }

    container.innerHTML = filtered.map(product => `

        <div class="product">

            <img
                src="${product.image}"
                alt="${escapeHTML(product.name)}"
                onerror="this.src='https://via.placeholder.com/300x200?text=Grocery'"
            >

            <h3>${escapeHTML(product.name)}</h3>

            <div class="category-label">
                ${escapeHTML(product.category)}
            </div>

            <p style="font-size:13px;color:#666;margin-bottom:8px;">
                ${escapeHTML(product.description || "")}
            </p>

            <div class="price">
                ₹${Number(product.price).toLocaleString("en-IN")}
            </div>

            <button class="add-cart"
                onclick="addToCart(${product.id})">
                Add to Cart
            </button>

            <div class="admin-controls">

                <button
                    class="edit-btn"
                    onclick="openEditProduct(${product.id})">
                    ✏️ Edit
                </button>

                <button
                    class="delete-btn"
                    onclick="deleteProduct(${product.id})">
                    🗑️ Delete
                </button>

            </div>

        </div>

    `).join("");
}


/* =========================================================
   CART
========================================================= */

function addToCart(id) {

    const existing = cart.find(item => item.id === id);

    if (existing) {
        existing.quantity++;
    } else {
        cart.push({
            id: id,
            quantity: 1
        });
    }

    saveCart();
    updateCartCount();

    alert("Product added to cart!");
}


function saveCart() {
    localStorage.setItem("madaCart", JSON.stringify(cart));
}


function updateCartCount() {

    const count = cart.reduce(
        (total,item) => total + item.quantity,
        0
    );

    document.getElementById("cartCount").textContent = count;
}


function openCart() {

    displayCart();

    document.getElementById("cartModal").style.display = "flex";
}


function displayCart() {

    const container = document.getElementById("cartItems");

    if (cart.length === 0) {
        container.innerHTML = `
            <div class="empty">
                Your cart is empty.
            </div>
        `;

        document.getElementById("cartTotal").textContent = "0";
        return;
    }

    let total = 0;

    container.innerHTML = cart.map(item => {

        const product = products.find(p => p.id === item.id);

        if (!product) return "";

        const itemTotal = product.price * item.quantity;

        total += itemTotal;

        return `
            <div class="cart-item">

                <div>
                    <strong>${escapeHTML(product.name)}</strong>
                    <br>
                    ₹${product.price} × ${item.quantity}
                </div>

                <div class="quantity-controls">

                    <button onclick="changeQuantity(${item.id},-1)">
                        −
                    </button>

                    <button onclick="changeQuantity(${item.id},1)">
                        +
                    </button>

                </div>

            </div>
        `;

    }).join("");

    document.getElementById("cartTotal").textContent =
        total.toLocaleString("en-IN");
}


function changeQuantity(id, change) {

    const item = cart.find(i => i.id === id);

    if (!item) return;

    item.quantity += change;

    if (item.quantity <= 0) {
        cart = cart.filter(i => i.id !== id);
    }

    saveCart();
    updateCartCount();
    displayCart();
}


/* =========================================================
   WHATSAPP ORDER
========================================================= */

function sendWhatsAppOrder() {

    if (cart.length === 0) {
        alert("Your cart is empty.");
        return;
    }

    const name =
        document.getElementById("customerName").value.trim();

    const address =
        document.getElementById("customerAddress").value.trim();

    const phone =
        document.getElementById("customerPhone").value.trim();

    if (!name || !address || !phone) {
        alert("Please enter your name, address and phone number.");
        return;
    }

    let message =
        "*NEW ORDER - MADA GENERAL STORE*%0A%0A";

    message += "*Customer:* " + encodeURIComponent(name) + "%0A";
    message += "*Phone:* " + encodeURIComponent(phone) + "%0A";
    message += "*Address:* " + encodeURIComponent(address) + "%0A%0A";

    message += "*ITEMS:*%0A";

    let total = 0;

    cart.forEach(item => {

        const product = products.find(p => p.id === item.id);

        if (!product) return;

        const itemTotal =
            product.price * item.quantity;

        total += itemTotal;

        message +=
            "• " +
            encodeURIComponent(product.name) +
            " x " +
            item.quantity +
            " = ₹" +
            itemTotal +
            "%0A";
    });

    message +=
        "%0A*TOTAL: ₹" +
        total +
        "*%0A%0A";

    message +=
        "Please confirm the order. Thank you!";

    const whatsappNumber = "918792043577";

    const url =
        "https://wa.me/" +
        whatsappNumber +
        "?text=" +
        message;

    window.open(url, "_blank");
}


/* =========================================================
   ADMIN LOGIN
========================================================= */

function openAdminLogin() {

    if (isAdmin) {
        alert("You are already logged in as admin.");
        return;
    }

    document.getElementById("adminLoginModal").style.display = "flex";
}


function loginAdmin() {

    const pin =
        document.getElementById("adminPin").value;

    if (pin === "689768") {

        isAdmin = true;

        sessionStorage.setItem(
            "madaAdmin",
            "true"
        );

        document.body.classList.add("admin-mode");

        closeModal("adminLoginModal");

        alert("Admin login successful!");

        displayProducts();

    } else {

        document.getElementById("loginError").textContent =
            "Incorrect PIN.";
    }
}


function logoutAdmin() {

    isAdmin = false;

    sessionStorage.removeItem("madaAdmin");

    document.body.classList.remove("admin-mode");

    displayProducts();

    alert("Admin logged out.");
}


/* =========================================================
   ADD PRODUCT
========================================================= */

function openAddProduct() {

    if (!isAdmin) {
        alert("Admin login required.");
        return;
    }

    document.getElementById("productModalTitle").textContent =
        "Add Product";

    document.getElementById("editProductId").value = "";

    document.getElementById("productName").value = "";
    document.getElementById("productPrice").value = "";
    document.getElementById("productImage").value = "";
    document.getElementById("productDescription").value = "";

    document.getElementById("productModal").style.display = "flex";
}


/* =========================================================
   EDIT PRODUCT
========================================================= */

function openEditProduct(id) {

    if (!isAdmin) {
        alert("Admin login required.");
        return;
    }

    const product =
        products.find(p => p.id === id);

    if (!product) return;

    document.getElementById("productModalTitle").textContent =
        "Edit Product";

    document.getElementById("editProductId").value =
        product.id;

    document.getElementById("productName").value =
        product.name;

    document.getElementById("productPrice").value =
        product.price;

    document.getElementById("productCategory").value =
        product.category;

    document.getElementById("productImage").value =
        product.image;

    document.getElementById("productDescription").value =
        product.description || "";

    document.getElementById("productModal").style.display = "flex";
}


/* =========================================================
   SAVE PRODUCT
========================================================= */

function saveProduct() {

    if (!isAdmin) {
        alert("Admin login required.");
        return;
    }

    const id =
        document.getElementById("editProductId").value;

    const name =
        document.getElementById("productName").value.trim();

    const price =
        Number(document.getElementById("productPrice").value);

    const category =
        document.getElementById("productCategory").value;

    const image =
        document.getElementById("productImage").value.trim();

    const description =
        document.getElementById("productDescription").value.trim();

    if (!name || !price || !image) {
        alert("Please fill product name, price and image.");
        return;
    }

    if (id) {

        const product =
            products.find(p => p.id == id);

        if (!product) return;

        product.name = name;
        product.price = price;
        product.category = category;
        product.image = image;
        product.description = description;

    } else {

        products.push({

            id: Date.now(),

            name: name,

            price: price,

            category: category,

            image: image,

            description: description
        });
    }

    saveProducts();

    displayCategories();
    displayProducts();

    closeModal("productModal");

    alert(
        id
        ? "Product updated successfully!"
        : "Product added successfully!"
    );
}


/* =========================================================
   DELETE PRODUCT
========================================================= */

function deleteProduct(id) {

    if (!isAdmin) {
        alert("Admin login required.");
        return;
    }

    const product =
        products.find(p => p.id === id);

    if (!product) return;

    if (!confirm(
        "Delete " + product.name + "?"
    )) {
        return;
    }

    products =
        products.filter(p => p.id !== id);

    saveProducts();

    displayCategories();
    displayProducts();
}


/* =========================================================
   MODAL HELPERS
========================================================= */

function closeModal(id) {
    document.getElementById(id).style.display = "none";
}


/* =========================================================
   SECURITY / HTML HELPERS
========================================================= */

function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function escapeQuotes(text) {

    return String(text)
        .replace(/'/g, "\\'")
        .replace(/"/g, "&quot;");
}


/* =========================================================
   CLOSE MODAL WHEN CLICKING OUTSIDE
========================================================= */

window.onclick = function(event) {

    const modals =
        document.querySelectorAll(".modal");

    modals.forEach(modal => {

        if (event.target === modal) {
            modal.style.display = "none";
        }

    });
};


/* =========================================================
   INITIALIZE
========================================================= */

displayCategories();
displayProducts();
updateCartCount();

</script>
