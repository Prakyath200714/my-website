<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MADA General Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: #f8f8f8;
            margin: 0;
            padding: 0;
        }
        header {
            background: #4A90E2;
            padding: 20px;
            color: white;
            text-align: center;
        }
        h1 {
            margin: 0;
            font-size: 2.5em;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            padding: 20px;
        }
        .product {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            margin: 15px;
            text-align: center;
            width: 250px;
            box-shadow: 0 2px 5px rgba(0,0,0,.15);
        }
        .product img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        }
        button {
            background: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
        }
        button:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <header>
        <h1>MADA GENERAL STORE</h1>
        <p>Luxury Grocery Shopping</p>
    </header>
    <div class="container">
        <div class="product">
            <img src="path/to/image1.jpg" alt="Product 1">
            <h2>Product 1</h2>
            <p>Price: ₹500</p>
            <button onclick="addToCart('Product 1', 500)">Add to Cart</button>
        </div>
        <div class="product">
            <img src="path/to/image2.jpg" alt="Product 2">
            <h2>Product 2</h2>
            <p>Price: ₹300</p>
            <button onclick="addToCart('Product 2', 300)">Add to Cart</button>
        </div>
        <!-- Add more products as needed -->
    </div>
    <script>
        const cart = [];
        
        function addToCart(productName, price) {
            cart.push({ productName, price });
            alert(productName + ' has been added to your cart!');
            // Simulated WhatsApp message to owner (needs backend for actual functionality)
            const ownerNumber = 8792043577;
            const message = `New order: ${productName} for ₹${price}`;
            window.open(`https://wa.me/${ownerNumber}?text=${encodeURIComponent(message)}`, '_blank');

            // Simulated bill generation
            const totalBill = cart.reduce((acc, item) => acc + item.price, 0);
            if (totalBill > 500) {
                alert('Free delivery! Total order amount is ₹' + totalBill);
            }
            alert('Thank you for visiting! Your bill will be sent to your WhatsApp shortly.');
        }
    </script>
</body>
</html>
